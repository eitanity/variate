# Discrete values where they mean something: damaged items per shipment
# binomial, resends geometric, an inspection Bernoulli, complaints
# negative binomial.
period: { days: 365 }
graphs:
  - id: shipping
    sources:
      - { id: shipment, frequency: { pert: [200, 300, 450] }, to: receive }
    nodes:
      - id: receive
        functions:
          - { name: damaged, category: items, binomial: { n: {{items}}, p: {{damage_p}} } }
          - { name: inspection, category: inspections, bernoulli: 0.1 }
          - { name: complaints, category: complaints, negbin: { mean: {{complaints}}, size: 2 } }
        outcomes:
          - { to: resend, p: {{resend_p}} }
          - { to: accepted }
      - id: resend
        functions:
          - { name: resends, category: resends, geometric: {{accept_p}} }
          - { name: freight, category: money, pert: [80, 150, 400] }
      - { id: accepted }
