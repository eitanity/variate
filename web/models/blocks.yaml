period: { days: 365 }
graphs:
  - id: cooling
    sources:
      - id: plant_down
        block:
          unit: hours
          series:
            - { kofn: { k: 2, n: 3, mtbf: { constant: {{chiller_mtbf}}, range: { times: [0.67, 1.5] } }, mttr: { constant: {{chiller_mttr}}, range: { times: [0.67, 2] } } } }
            - { kofn: { k: 1, n: 2, mtbf: { constant: {{pump_mtbf}}, range: { times: [0.67, 1.67] } }, mttr: 24 } }
            - { mtbf: {{control_mtbf}}, mttr: 8 }
        to: outage
    nodes:
      - id: outage
        functions:
          - { name: callout, category: labour, basis: on_entry, pert: [500, 1500, 5000] }
          - { name: lost_production, category: production, basis: per_time, unit: days, pert: [2e4, {{downtime_peak}}, 1.5e5] }
        outcomes:
          - { to: restored, holding: outage }
      - id: restored
