period: { days: 365 }
graphs:
  - id: pump_station
    sources:
      - { id: wear_trip,   frequency: { pert: [5, {{wear_peak}}, 600] }, to: trip }
      - { id: grid_outage, frequency: { pert: [0, {{grid_peak}}, 20] },   to: fault_check }
    nodes:
      - id: trip
        outcomes:
          - { to: fault_check, p: { pert: [0.001, {{fault_peak}}, 0.3] } }
          - { to: auto_restart }
      - id: auto_restart
      - id: fault_check
        mode: sequential
        outcomes:
          - { to: minor_repair, p: { pert: [0.4, 0.6, 0.8] }, holding: { lognormal: { median: 4, p90: 24 }, unit: hours } }
          - { to: major_repair, p: 0.75, holding: { lognormal: { median: 2, p90: 7 }, unit: days } }
          - { to: false_alarm }
      - id: false_alarm
      - id: minor_repair
        functions:
          - { name: callout, category: labour, basis: on_entry, pert: [500, 1200, 4000] }
      - id: major_repair
        functions:
          - { name: parts,    category: materials,  basis: on_entry, logpert: [2e3, 8e3, 2e5] }
          - { name: downtime, category: production, basis: per_time, unit: days, pert: [1e3, {{downtime_peak}}, 2e5] }
        outcomes:
          - { to: replace,  p: {{replace_p}}, holding: { pert: [1, 3, 10], unit: days } }
          - { to: restored,         holding: { pert: [1, 3, 10], unit: days } }
      - id: replace
        functions:
          - { name: new_pump, category: capital, basis: on_entry, logpert: [5e4, 1e5, 1e6] }
        next: inspection
        next_holding: { pert: [5, 10, 30], unit: days }
      - id: inspection
        functions:
          - { name: certification, category: compliance, basis: on_entry, pert: [1e3, 3e3, 2e4] }
      - id: restored
