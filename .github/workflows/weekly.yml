name: weekly
on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GOFLAGS: -trimpath
  GOTOOLCHAIN: local

jobs:
  # A scheduled run on the commit the last run already tested has
  # nothing new to find; a manual run always goes ahead.
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/weekly.yml/runs?status=completed&branch=$GITHUB_REF_NAME&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$last" != "$GITHUB_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  stat:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Long statistical suite
        run: make stat

  fuzz:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Fuzz (30 min each)
        run: make fuzz-long
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"

  bench:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Benchmarks
        run: make bench
      - name: Find the newest baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bench-baseline&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')"
          echo "run-id=$run" >> "$GITHUB_OUTPUT"
      - name: Fetch the baseline
        if: steps.baseline.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: bench-baseline
          path: baseline
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Compare with benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          if [ -f baseline/bench.out ]; then
            benchstat -alpha 0.05 baseline/bench.out bench.out | tee benchstat.txt
            if grep -E '^(BenchmarkPERT|BenchmarkWalk|BenchmarkChain)' benchstat.txt | grep -Eq '\+([5-9]\.[0-9]+|[1-9][0-9]+\.[0-9]+)%'; then
              echo "::error::benchmark regression over 5%"; exit 1
            fi
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bench-baseline
          path: bench.out
          retention-days: 90
