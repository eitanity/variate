name: nightly
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GOFLAGS: -trimpath
  GOTOOLCHAIN: local

jobs:
  stat:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Long statistical suite
        run: make stat

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Fuzz (30 min each)
        run: make fuzz-long

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Benchmarks
        run: make bench
      - name: Fetch previous night
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-baseline
          path: baseline
      - name: Compare with benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          if [ -f baseline/bench.out ]; then
            benchstat -alpha 0.05 baseline/bench.out bench.out | tee benchstat.txt
            if grep -E '^(BenchmarkPERT|BenchmarkWalk|BenchmarkChain)' benchstat.txt | grep -Eq '\+([5-9]\.[0-9]+|[1-9][0-9]+\.[0-9]+)%'; then
              echo "::error::benchmark regression over 5%"; exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: bench.out
          retention-days: 7
