name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GOFLAGS: -trimpath
  GOTOOLCHAIN: local

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Every-push set
        run: make ci
      - name: Nightly set
        run: make nightly

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Reproducible build
        run: make release
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/variate
            bin/variate.sha256
