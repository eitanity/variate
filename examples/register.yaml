# event, with a control that stops a share of events and a cap on any
# one loss. The exceedance curve of the period total is the cumulative
# risk profile; the breakdown by source ranks the risks by expected
# loss. Every rate is a gamma, so the exact distribution is closed
# form and the curve comes with bounds in about a second.
