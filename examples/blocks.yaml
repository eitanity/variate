# A cooling plant as a reliability block diagram: chillers two of three,
# pumps one of two, and the control system, in series, each with a mean
# time between failures and a mean repair time in hours. The engine
# simulates the units' failures and repairs as a Markov chain and fires
# the outage source each time the plant goes down, so a redundant
# block's failures cluster after a unit failure as they do in life;
# variate plan prints the stationary rate, the system MTBF and the
# unavailability. Each outage costs a callout and production per day
# for as long as the plant is down: the outcome's holding is the
# outage itself, the time the chain takes to bring the plant back.
period: { days: 365 }
graphs:
  - id: cooling
    sources:
      - id: plant_down
        block:
          unit: hours
          series:
            - { kofn: { k: 2, n: 3, mtbf: 6000, mttr: 36 } }
            - { kofn: { k: 1, n: 2, mtbf: 12000, mttr: 24 } }
            - { mtbf: 30000, mttr: 8 }
        to: outage
    nodes:
      - id: outage
        functions:
          - { name: callout, category: labour, basis: on_entry, pert: [500, 1500, 5000] }
          - { name: lost_production, category: production, basis: per_time, unit: days, pert: [2e4, 5e4, 1.5e5] }
        outcomes:
          - { to: restored, holding: outage }
      - id: restored
